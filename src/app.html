<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Fonts: Barlow Condensed (Destiny UI match) · Barlow (body) · JetBrains Mono -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Pre-open sockets to Bungie's CDN so icons/images are instant -->
		<link rel="preconnect" href="https://www.bungie.net" crossorigin />
		<link rel="dns-prefetch" href="https://www.bungie.net" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
